<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Registered Users Directory')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container">
        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
                <h4 class="fw-bold mb-0 text-dark">Registered Accounts Directory</h4>
            </div>
            <span class="badge bg-primary fs-6 px-3 py-2" th:text="${users.size()} + ' Total Users'">0</span>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                    <thead class="table-light">
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Account Status</th>
                            <th>Registered Date</th>
                            <th class="text-end">Manage Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="font-monospace" th:text="'#USR-' + ${u.id}">#USR-1</td>
                            <td class="fw-bold text-dark" th:text="${u.fullName}">User Full Name</td>
                            <td th:text="${u.email}">user@railbook.com</td>
                            <td class="text-muted" th:text="${u.phone != null ? u.phone : '--'}">9876543210</td>
                            <td>
                                <span th:if="${u.role.name() == 'ROLE_ADMIN'}" class="badge bg-danger-subtle text-danger fw-bold">
                                    ROLE_ADMIN
                                </span>
                                <span th:if="${u.role.name() == 'ROLE_USER'}" class="badge bg-primary-subtle text-primary fw-bold">
                                    ROLE_USER
                                </span>
                            </td>
                            <td>
                                <span th:if="${u.enabled}" class="badge bg-success-subtle text-success">Active</span>
                                <span th:unless="${u.enabled}" class="badge bg-secondary-subtle text-secondary">Disabled</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'dd-MMM-yyyy')}">11-Nov-2026</td>
                            <td class="text-end">
                                <div th:if="${u.email != 'admin@railbook.com'}" class="btn-group btn-group-sm">
                                    <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Toggle user account status?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-outline-secondary" th:title="${u.enabled ? 'Disable Account' : 'Enable Account'}">
                                            <i th:class="${u.enabled ? 'bi bi-person-x' : 'bi bi-person-check'}"></i>
                                            <span th:text="${u.enabled ? 'Disable' : 'Enable'}"></span>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/toggle-role(id=${u.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Change user authorization role?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-outline-primary" title="Toggle Admin/User Role">
                                            <i class="bi bi-shield-shaded"></i> Role
                                        </button>
                                    </form>
                                </div>
                                <span th:if="${u.email == 'admin@railbook.com'}" class="badge bg-light text-muted border">System SuperAdmin</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
