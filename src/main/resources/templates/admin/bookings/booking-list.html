<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Master Bookings List')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
                <h4 class="fw-bold mb-0 text-dark">Master Reservation Register</h4>
            </div>
            <span class="badge bg-primary fs-6 px-3 py-2" th:text="${bookings.size()} + ' Total Bookings'">0</span>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                    <thead class="table-light">
                        <tr>
                            <th>PNR Number</th>
                            <th>Booked By</th>
                            <th>Train No. & Name</th>
                            <th>Route</th>
                            <th>Class</th>
                            <th>Journey Date</th>
                            <th>Passengers</th>
                            <th>Total Fare</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bookings}">
                            <td><strong class="text-primary font-monospace" th:text="${b.pnrNumber}">4829104821</strong></td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${b.user.fullName}">User Name</div>
                                <div class="text-muted" style="font-size: 0.75rem;" th:text="${b.user.email}">user@railbook.com</div>
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${b.train.trainNumber}">12004</div>
                                <div class="text-muted" th:text="${b.train.trainName}">Lucknow Shatabdi</div>
                            </td>
                            <td>
                                <span th:text="${b.train.sourceStation.stationCode}">NDLS</span> → <span th:text="${b.train.destinationStation.stationCode}">LKO</span>
                            </td>
                            <td><span class="badge bg-secondary-subtle text-secondary" th:text="${b.travelClass.code}">CC</span></td>
                            <td th:text="${#temporals.format(b.journeyDate, 'dd-MMM-yyyy')}">20-Nov-2026</td>
                            <td th:text="${b.passengers.size()} + ' Pax'">1 Pax</td>
                            <td><strong class="text-success" th:text="'₹ ' + ${b.totalFare}">₹ 1,165</strong></td>
                            <td>
                                <span th:if="${b.bookingStatus.name() == 'CONFIRMED'}" class="badge bg-success-subtle text-success fw-bold">
                                    CONFIRMED
                                </span>
                                <span th:if="${b.bookingStatus.name() == 'CANCELLED'}" class="badge bg-danger-subtle text-danger fw-bold">
                                    CANCELLED
                                </span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/bookings/{pnr}(pnr=${b.pnrNumber})}" class="btn btn-outline-primary" title="View Details">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/ticket/{pnr}(pnr=${b.pnrNumber})}" class="btn btn-outline-secondary" title="View E-Ticket">
                                        <i class="bi bi-printer"></i>
                                    </a>
                                    <a th:href="@{/ticket/{pnr}/pdf(pnr=${b.pnrNumber})}" class="btn btn-outline-danger" title="PDF">
                                        <i class="bi bi-file-pdf"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
