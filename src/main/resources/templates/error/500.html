<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('500 - Server Error')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-warning display-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">500 – Internal System Alert</h1>
        <p class="text-muted fs-5 max-w-600 mx-auto mb-4" th:text="${errorMessage}">
            An unexpected error occurred while communicating with the database or processing your reservation.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary px-4 fw-bold" style="background-color: #0077B6;">
                <i class="bi bi-house-door me-1"></i> Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4 fw-semibold">
                <i class="bi bi-arrow-clockwise me-1"></i> Retry
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
