<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Manage Trains')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container">
        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
                <h4 class="fw-bold mb-0 text-dark">Train Fleet Management</h4>
            </div>
            <a th:href="@{/admin/trains/new}" class="btn btn-primary btn-sm fw-bold" style="background-color: #0077B6;">
                <i class="bi bi-plus-circle me-1"></i> Add New Train
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>Train #</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Origin</th>
                            <th>Destination</th>
                            <th>Timings</th>
                            <th>Running Days</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${trains}">
                            <td><strong class="text-primary font-monospace" th:text="${t.trainNumber}">12004</strong></td>
                            <td class="fw-bold" th:text="${t.trainName}">Lucknow Shatabdi</td>
                            <td><span class="badge bg-light text-dark border" th:text="${t.trainType}">Shatabdi</span></td>
                            <td th:text="${t.sourceStation.formattedDisplay}">NDLS</td>
                            <td th:text="${t.destinationStation.formattedDisplay}">LKO</td>
                            <td>
                                <span th:text="${#temporals.format(t.departureTime, 'HH:mm')}">06:00</span> -
                                <span th:text="${#temporals.format(t.arrivalTime, 'HH:mm')}">12:30</span>
                                <div class="small text-muted" th:text="${t.durationHours}">06h 30m</div>
                            </td>
                            <td class="small" th:text="${t.runningDays}">MON..SUN</td>
                            <td>
                                <span th:if="${t.active}" class="badge bg-success-subtle text-success">Active</span>
                                <span th:unless="${t.active}" class="badge bg-secondary-subtle text-secondary">Inactive</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/trains/edit/{id}(id=${t.id})}" class="btn btn-outline-primary" title="Edit Train">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/trains/delete/{id}(id=${t.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this train?');">
                                        <button type="submit" class="btn btn-outline-danger" title="Delete Train">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
