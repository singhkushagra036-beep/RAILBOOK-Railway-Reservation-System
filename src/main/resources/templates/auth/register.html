<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Create Account')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <!-- Registration Card -->
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-4" style="background: linear-gradient(135deg, #0B2545 0%, #134074 100%) !important;">
                        <i class="bi bi-person-plus-fill fs-1 text-info"></i>
                        <h4 class="fw-bold mt-2 mb-0">Join RailBook</h4>
                        <p class="small text-white-50 mb-0">Create an account for seamless train reservations</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <!-- Alert Messages -->
                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center small" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                            <span th:text="${errorMessage}">Registration error</span>
                        </div>

                        <!-- Registration Form -->
                        <form th:action="@{/register}" method="post" th:object="${registrationDto}">
                            <div class="mb-3">
                                <label for="fullName" class="form-label small fw-bold">Full Name *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{fullName}" id="fullName" class="form-control" placeholder="John Doe" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label small fw-bold">Email Address *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="name@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label small fw-bold">Mobile Number (10 digits)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-phone"></i></span>
                                    <input type="tel" th:field="*{phone}" id="phone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="row g-2 mb-4">
                                <div class="col-md-6">
                                    <label for="password" class="form-label small fw-bold">Password *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                        <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Min 6 characters" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label small fw-bold">Confirm Password *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                        <input type="password" th:field="*{confirmPassword}" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #0077B6; border-color: #0077B6;">
                                <i class="bi bi-person-check me-1"></i> Complete Registration
                            </button>
                        </form>

                        <div class="text-center mt-4 small">
                            Already registered?
                            <a th:href="@{/login}" class="fw-bold text-decoration-none text-primary">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
