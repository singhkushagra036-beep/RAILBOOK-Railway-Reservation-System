<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('403 Forbidden - Access Denied')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="mb-4">
            <i class="bi bi-shield-slash text-danger display-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">403 – Access Forbidden</h1>
        <p class="text-muted fs-5 max-w-600 mx-auto mb-4" th:text="${errorMessage}">
            You do not have permission to access this administrative resource.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary px-4 fw-bold" style="background-color: #0077B6;">
                <i class="bi bi-house-door me-1"></i> Home
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4 fw-semibold">
                <i class="bi bi-speedometer2 me-1"></i> User Dashboard
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
