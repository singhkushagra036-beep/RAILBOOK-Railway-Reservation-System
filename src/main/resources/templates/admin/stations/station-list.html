<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Manage Stations')}"></head>
<body class="bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="py-5">
    <div class="container">
        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
                <h4 class="fw-bold mb-0 text-dark">Railway Stations Directory</h4>
            </div>
            <button type="button" class="btn btn-primary btn-sm fw-bold" data-bs-toggle="collapse" data-bs-target="#addStationCard" style="background-color: #0077B6;">
                <i class="bi bi-plus-circle me-1"></i> Add Station
            </button>
        </div>

        <!-- Add Station Collapsible Form -->
        <div class="collapse mb-4" id="addStationCard">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                <h5 class="fw-bold text-dark mb-3">Add New Station</h5>
                <form th:action="@{/admin/stations/save}" method="post" th:object="${stationDto}">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Station Code *</label>
                            <input type="text" th:field="*{stationCode}" class="form-control" placeholder="e.g. NDLS" maxlength="10" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Station Name *</label>
                            <input type="text" th:field="*{stationName}" class="form-control" placeholder="e.g. New Delhi" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">City *</label>
                            <input type="text" th:field="*{city}" class="form-control" placeholder="e.g. New Delhi" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">State</label>
                            <input type="text" th:field="*{state}" class="form-control" placeholder="e.g. Delhi">
                        </div>
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-secondary btn-sm me-2" data-bs-toggle="collapse" data-bs-target="#addStationCard">Cancel</button>
                            <button type="submit" class="btn btn-primary btn-sm fw-bold" style="background-color: #0077B6;">Save Station</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Stations Table -->
        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>Station Code</th>
                            <th>Station Name</th>
                            <th>City</th>
                            <th>State</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="st : ${stations}">
                            <td><strong class="text-primary font-monospace fs-6" th:text="${st.stationCode}">NDLS</strong></td>
                            <td class="fw-bold" th:text="${st.stationName}">New Delhi</td>
                            <td th:text="${st.city}">New Delhi</td>
                            <td class="text-muted" th:text="${st.state != null ? st.state : '--'}">Delhi</td>
                            <td class="text-end">
                                <form th:action="@{/admin/stations/delete/{id}(id=${st.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to delete this station?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Station">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
