spring.application.name=railbook

# Server Configuration: defaults to port 8080 or respects $PORT from cloud platforms (Render/Vercel)
server.port=${PORT:8080}
server.servlet.context-path=
server.forward-headers-strategy=framework

# MariaDB / MySQL Database Configuration with Environment Variable support
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mariadb://127.0.0.1:3306/railbook_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Demo Profile / Initializer
railbook.demo-data.enabled=${DEMO_DATA_ENABLED:true}
